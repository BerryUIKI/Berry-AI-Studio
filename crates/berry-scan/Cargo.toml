[package]
name = "berry-scan"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Folder scanning and indexing orchestration for Berry AI Studio"

[dependencies]
berry-domain = { path = "../berry-domain" }
berry-metadata = { path = "../berry-metadata" }
berry-storage = { path = "../berry-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "rayon"] }
rayon = "1.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.40.2", features = ["bundled"] }


[[bench]]
name = "large_library"
harness = false

[[bench]]
name = "directory_fingerprint"
harness = false
