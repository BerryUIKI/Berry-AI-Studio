[package]
name = "berry-ai-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local asset manager and prompt studio for AI-generated images"
authors = ["Berry Wahlberg"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "berry_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
berry-domain = { path = "../crates/berry-domain" }
berry-metadata = { path = "../crates/berry-metadata" }
berry-scan = { path = "../crates/berry-scan" }
berry-storage = { path = "../crates/berry-storage" }
berry-tagger = { path = "../crates/berry-tagger" }
berry-clip = { path = "../crates/berry-clip" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
trash = "5"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
uuid = { version = "1", features = ["v4"] }
notify = "8.2.0"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
minisign-verify = "0.2.5"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
base64 = "0.22"
zip = { version = "2.2", default-features = false, features = ["deflate"] }


